server {
    listen 80;
    listen [::]:80;
    server_name elder-hub.pl www.elder-hub.pl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://elder-hub.pl$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name elder-hub.pl www.elder-hub.pl;
    ssl_certificate /etc/letsencrypt/live/elder-hub.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elder-hub.pl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($host = www.elder-hub.pl) {
        return 301 https://elder-hub.pl$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        client_max_body_size 5m;
    }
}
